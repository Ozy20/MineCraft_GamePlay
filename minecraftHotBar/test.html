<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Lesson 1 — My Minecraft Hotbar</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <h1 class="title">My Minecraft Hotbar 🎮</h1>

  <div class="selected-text" id="selectedText">
    Click a slot to pick an item!
  </div>

  <div class="hotbar">
    <div class="slot" data-item="Dirt" onclick="selectItem(this)">🟫</div>
    <div class="slot" data-item="Grass Block" onclick="selectItem(this)">🌱</div>
    <div class="slot" data-item="Stone" onclick="selectItem(this)">⬜</div>
    <div class="slot" data-item="Wood" onclick="selectItem(this)">🪵</div>
    <div class="slot" data-item="Sword" onclick="selectItem(this)">⚔️</div>
    <div class="slot" data-item="Pickaxe" onclick="selectItem(this)">⛏️</div>
    <div class="slot" data-item="Apple" onclick="selectItem(this)">🍎</div>
    <div class="slot" data-item="Bread" onclick="selectItem(this)">🍞</div>
    <div class="slot" data-item="Torch" onclick="selectItem(this)">🔥</div>
  </div>

</body>

</html>
